name: Recover stuck Pages deployment
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pages-recovery.yml
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/pages/deployments/dc2f7919595fafa5f9dc3a6201681e64fb646d97/cancel"
